[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Mali Gate"]

[workspace.dependencies]
rmcp = { version = "3.8", default-features = false, features = ["server", "client", "macros", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
schemars = "1.2"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.9"
toml_edit = "0.23"
clap = { version = "4", features = ["derive"] }
colored = "3"
crossterm = "0.29"
ratatui = "0.29"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[profile.dev]
# ลดขนาด debug info ลงอย่างมาก (เก็บแค่ line tables พอสำหรับ backtrace)
debug = "line-tables-only"

# เปิด incremental เฉพาะเมื่อต้องการ; ปิดไว้ช่วยไม่ให้ target โตเร็ว
# (เปิดกลับได้ด้วย CARGO_INCREMENTAL=1 ชั่วคราวเมื่อต้องการ)
incremental = false

[profile.dev.package."*"]
# dependencies ไม่จำเป็นต้องมี debug info เลย
debug = 0

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "debuginfo"
